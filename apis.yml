aid: jedify
name: Jedify
description: >-
  Jedify is an enterprise AI platform that fuses business context with multi-source
  data into an AI-ready contextual "context layer" (Semantic Fusion) so companies can
  run grounded, natural-language analytics and autonomous data agents across their data
  lakes, warehouses, BI tools, databases, CRMs, and documents. It exposes an asynchronous
  session/inquiry REST API at be.jedify.com/api (X-API-Key auth), a published Model Context
  Protocol (MCP) server with Asker, Editor, and Builder modes for connecting Claude, Cursor,
  and other agents, plus native data connectors (Snowflake, BigQuery, Redshift, Databricks,
  Athena, dbt, Looker, Tableau) and embedded surfaces for Looker and Slack. Jedify raised a
  $24M Series A and is backed by Norwest Venture Partners.
